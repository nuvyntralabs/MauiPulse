# PackAsTool pipeline for Plugin.Maui.Pulse.Cli (command maui-pulse).
# Tests and pack only until this tree is extracted to nuvyntralabs/MauiPulse.
# Never push NuGet from a local clone.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test
        run: dotnet test Pulse.sln -c Release --nologo
      - name: Pack (never push)
        run: |
          mkdir -p artifacts
          dotnet pack src/Plugin.Maui.Pulse/Plugin.Maui.Pulse.csproj -c Release -o artifacts --nologo
          dotnet pack src/Plugin.Maui.Pulse.Cli/Plugin.Maui.Pulse.Cli.csproj -c Release -o artifacts --nologo
